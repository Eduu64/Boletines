# ─────────────────────────────────────────────────────────────────────────────
# OpoAlerta Docker v2.3.11 · MODO REFORZADO (proxy interno de salida)
#
#   docker compose -f docker-compose.reforzado.yml up -d --build
#
# 100 % Docker: tres contenedores (frontal + app + proxy) y dos redes de
# Docker. El sistema operativo del host NO se toca: sin iptables, sin ufw,
# sin servicios ni usuarios nuevos — solo comandos de «docker compose».
#
# Diferencia con docker-compose.yml: el contenedor de la app vive en una red
# Docker SIN internet (internal: true) y su ÚNICA vía de salida es un proxy
# Squid con lista blanca (los 16 boletines + Discord, proxy/dominios.list).
# Dos capas: la lista blanca dentro de la app (CORTAFUEGOS_SALIDA, sigue
# activa) y la lista blanca en la red. Aunque el código de la app se viera
# comprometido, ninguna conexión a otro destino saldría: muere en la red.
# Tampoco puede iniciar conexiones a tu LAN (192.168.x.x). El puerto del panel
# lo publica el contenedor «frontal» (una puerta de entrada con cortafuegos
# hacia la app): Docker no puede publicar puertos de una red interna
# (moby/moby#53256) y por eso el frontal va aparte. El frontal aplica el MISMO
# cortafuegos de entrada (CORTAFUEGOS_ENTRADA) a la IP real del visitante: una
# IP pública recibe un 403 en el frontal, antes de tocar la app (la app lo ve
# todo desde la IP privada del frontal, y conserva su filtro como 2.ª capa).
# Si quieres además que Docker ni siquiera escuche en la interfaz pública:
# PUERTO_PUBLICADO=<IP-LAN>. Coste: ~70 MB de RAM extra (Squid ~23, frontal
# ~45 — es Node, para reutilizar el mismo filtro; comparte capas de imagen
# con la app, así que en disco apenas añade nada).
#
# Verificación: bash scripts/prueba-proxy.sh
#
# Notas:
# · Si añades un dominio con SALIDA_EXTRA, añádelo también a
#   proxy/dominios.list para que el proxy lo deje pasar.
# · Solo se permiten túneles TLS (puerto 443): todo lo que consulta la app
#   es https. Los tests con servidores locales (BOE falso, mock webhook)
#   se ejecutan fuera de Docker y no necesitan el proxy.
# ─────────────────────────────────────────────────────────────────────────────

services:
  opoalerta:
    build: .
    image: opoalerta-docker:2.3.11
    container_name: opoalerta
    restart: unless-stopped
    # SIN «ports:»: Docker no puede publicar puertos de un contenedor que solo
    # vive en redes «internal: true» (no tiene puerta de enlace donde publicar:
    # moby/moby#53256 — la config se acepta pero NetworkSettings.Ports queda
    # vacía). El panel entra por el contenedor «frontal» (más abajo). La app
    # conserva así su red sin internet y sin acceso a tu LAN.
    environment:
      # Base de datos (SQLite dentro del volumen, no tocar)
      DATABASE_URL: file:/app/data/opoalerta.db
      # Programador diario de ingestas de los boletines
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-1}
      HORARIO_INGESTA: ${HORARIO_INGESTA:-0 9 * * *,35 11 * * *}
      ZONA_HORARIA: ${ZONA_HORARIA:-Europe/Madrid}
      BACKFILL_DIAS: ${BACKFILL_DIAS:-7}
      # Bot de Discord global (opcional: también configurable desde la web)
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CANAL_ID: ${DISCORD_CANAL_ID:-}
      # Token de administración opcional (escrituras de la API + consola)
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # 1.ª capa: lista blanca de salida dentro de la app (se mantiene)
      CORTAFUEGOS_SALIDA: ${CORTAFUEGOS_SALIDA:-lista}
      SALIDA_EXTRA: ${SALIDA_EXTRA:-}
      # Cortafuegos de ENTRADA: el panel solo se sirve a IPs privadas (tu LAN,
      # redes Docker y loopback); una IP pública recibe un 403 inmediato.
      CORTAFUEGOS_ENTRADA: ${CORTAFUEGOS_ENTRADA:-lan}
      # 1 = el panel puede mostrarse dentro de un iframe externo (vistas previa)
      PERMITIR_EMBEBER: ${PERMITIR_EMBEBER:-0}
      TZ: ${TZ:-Europe/Madrid}
      # 2.ª capa: TODA la salida de Node atraviesa el proxy interno
      NODE_USE_ENV_PROXY: "1"            # fetch() nativo respeta el proxy (Node 24)
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,proxy
      no_proxy: localhost,127.0.0.1,proxy
    volumes:
      # Volumen con NOMBRE (no ./data del host): Docker lo inicializa con el
      # dueño de /app/data en la imagen (usuario opoalerta), así que la base de
      # datos siempre tiene permisos correctos sin tocar el host. El nombre
      # explícito lo hace estable aunque renombres la carpeta del proyecto.
      # OJO: «docker compose down» lo conserva; «down -v» lo BORRA.
      # ¿Prefieres la carpeta ./data visible del proyecto? Sustitúyelo por
      # «- ./data:/app/data» y asegúrate de que ./data pertenezca al mismo uid
      # que el usuario del contenedor («docker exec opoalerta id -u»), o la app
      # no podrá escribir la base de datos.
      - opoalerta-data:/app/data
    networks: [interna]
    # Contenedor endurecido y ligero: sin privilegios y con techo de memoria
    mem_limit: ${LIMITE_MEMORIA:-256m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 20s

  proxy:
    build: ./proxy
    image: opoalerta-proxy:2.3.11
    container_name: opoalerta-proxy
    restart: unless-stopped
    networks: [interna, salida]
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "squid", "-k", "check"]
      interval: 60s
      timeout: 5s
      retries: 3

  frontal:
    # Puerta de ENTRADA al panel en el modo reforzado. Docker no publica
    # puertos de contenedores que solo están en redes internas (moby/moby#53256),
    # así que este contenedor — frontal/frontal.mjs, ~60 líneas de Node —
    # recibe el puerto publicado, comprueba la IP real del visitante con el
    # MISMO cortafuegos de entrada que la app (una IP pública recibe un 403
    # aquí, antes de tocar la app) y reenvía a opoalerta:3000. No ejecuta
    # código de la app, no guarda nada. Está en la red «salida» SOLO para que
    # Docker tenga dónde publicar el puerto; nunca conecta a nada que no sea
    # la app.
    build:
      # El contexto es la RAÍZ del proyecto, no ./frontal: el Dockerfile del
      # frontal copia también servidor/cortafuegos.mjs (módulo compartido del
      # cortafuegos de entrada). Con «build: ./frontal» el contexto era solo la
      # carpeta frontal/ y esos COPY fallaban siempre («/frontal/frontal.mjs"
      # not found»): bug de empaquetado de la v2.3.9, corregido en la v2.3.10.
      context: .
      dockerfile: frontal/Dockerfile
    image: opoalerta-frontal:2.3.11
    container_name: opoalerta-frontal
    restart: unless-stopped
    ports:
      # 0.0.0.0 = todas las interfaces (recomendado, inmune a cambios de IP por
      # DHCP); <IP-LAN-del-servidor> = Docker ni siquiera abre el puerto en la
      # interfaz pública (más estricto; requiere IP fija o reserva DHCP).
      - "${PUERTO_PUBLICADO:-0.0.0.0}:${PUERTO:-3000}:3000"
    networks: [interna, salida]
    mem_limit: ${LIMITE_FRONTAL:-64m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - opoalerta
    environment:
      TZ: ${TZ:-Europe/Madrid}
      # CORTAFUEGOS_ENTRADA controla la puerta (el frontal) y la app a la vez:
      # con «lan» (por defecto) solo pasan IPs privadas; con «off» ambas capas
      # atienden a cualquiera. No hace falta definirlo: comparte el valor del
      # .env como el resto de variables.
      CORTAFUEGOS_ENTRADA: ${CORTAFUEGOS_ENTRADA:-lan}
    healthcheck:
      # Pasa por el frontal hasta la app: chequeo de extremo a extremo
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 10s

networks:
  interna:
    internal: true # sin ruta a internet ni a tu LAN
  salida:

volumes:
  opoalerta-data:
    name: opoalerta-data # nombre fijo: estable aunque cambie el nombre de la carpeta
